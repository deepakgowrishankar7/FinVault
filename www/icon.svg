<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062D2"/>
      <stop offset="60%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="fvDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#00C7BE"/>
    </linearGradient>
    <linearGradient id="fvGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#fvBg)"/>
  <rect width="510" height="510" x="1" y="1" rx="123" fill="none" stroke="url(#fvGlow)" stroke-width="2"/>

  <!-- Vault Shield Outer Ring -->
  <g filter="url(#fvShadow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="12" stroke-dasharray="16 32"/>

    <!-- Geometric Vault Monogram (F + Safe Door Combination) -->
    <!-- Vertical Pillar -->
    <rect x="176" y="146" width="38" height="220" rx="12" fill="#FFFFFF"/>
    
    <!-- Top Horizontal Bar & Middle Bar -->
    <path d="M176 158 C176 151.4 181.4 146 188 146 L332 146 C338.6 146 344 151.4 344 158 L344 186 C344 192.6 338.6 198 332 198 L214 198 L214 238 L308 238 C314.6 238 320 243.4 320 250 L320 278 C320 284.6 314.6 290 308 290 L214 290 L214 354 C214 360.6 208.6 366 202 366 L188 366 C181.4 366 176 360.6 176 354 Z" fill="#FFFFFF"/>

    <!-- Vault Central Combination Wheel Accent -->
    <circle cx="280" cy="264" r="38" fill="#0071E3" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="280" cy="264" r="22" fill="url(#fvDial)"/>
    <circle cx="280" cy="264" r="9" fill="#FFFFFF"/>
    <line x1="280" y1="232" x2="280" y2="238" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="280" y1="290" x2="280" y2="296" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="248" y1="264" x2="254" y2="264" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="306" y1="264" x2="312" y2="264" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
