name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FinVault Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Android Platform
        working-directory: mobile
        run: |
          echo "Configuring Flutter Android platform for mobile project..."
          flutter create . --org com.finvault --project-name finvault --platforms android

          # Configure release build to use debug signing key so APK is signed & installable
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("debug")\n        }/' android/app/build.gradle.kts || true
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/' android/app/build.gradle || true
          fi

          # Ensure gradlew has execute permission
          chmod +x android/gradlew || true

      - name: Inject Internet & Query Permissions into Manifest
        working-directory: mobile
        run: |
          # Add INTERNET and ACCESS_NETWORK_STATE permissions before <application>
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml || true
          
          # Add WhatsApp and UPI query schemes inside <queries>
          sed -i '/<\/queries>/i \        <intent>\n            <action android:name="android.intent.action.VIEW"\/>\n            <data android:scheme="whatsapp"\/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW"\/>\n            <data android:scheme="upi"\/>\n        <\/intent>' android/app/src/main/AndroidManifest.xml || true

      - name: Get Flutter Packages & Verify Assets
        working-directory: mobile
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          flutter build bundle -v 2>&1 | tee ../bundle.log

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons -v 2>&1 | tee ../flutter_build.log

      - name: Post Failure Log to Commit Comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "bundle.log" ]; then
            LOG_CONTENT=$(tail -n 80 bundle.log)
          elif [ -f "flutter_build.log" ]; then
            LOG_CONTENT=$(tail -n 80 flutter_build.log)
          else
            LOG_CONTENT="No log file found"
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="### ❌ Build Failure Details:
          \`\`\`text
          $LOG_CONTENT
          \`\`\`" || true

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/FinVault.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinVault-Flutter-APK
          path: release-output/FinVault.apk
          retention-days: 30

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "FinVault Flutter Native APK (v2.0.0)"
          body: |
            ### 🚀 FinVault Native Flutter Android Application (v2.0.0)

            - **App Name:** FinVault — Smart Loan & Repayment Ledger
            - **Engine:** Flutter Native Dart (60–120 FPS Butter-Smooth Native Performance)
            - **Platform:** Android 7.0+ (ARM64 & x86_64)
            - **Backend:** 100% On-Device Offline Storage + Supabase Cloud Sync
            - **Live Web App:** [FinVault Web App](https://deepakgowrishankar7.github.io/FinVault/)

            #### 📥 Quick Installation Instructions:
            1. Download the **`FinVault.apk`** file below directly on your Android phone.
            2. Tap the downloaded `.apk` notification or open it from your Files / Downloads app.
            3. If Android shows a security prompt (*"Install unknown apps"*), tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and enjoy ultra-smooth financial management!
          files: release-output/FinVault.apk
          draft: false
          prerelease: false
