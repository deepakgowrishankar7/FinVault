name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FinVault Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Android Platform
        working-directory: mobile
        run: |
          echo "Configuring Flutter Android platform for mobile project..."
          flutter create . --org com.finvault --project-name finvault --platforms android

          # Ensure gradlew has execute permission
          chmod +x android/gradlew || true

      - name: Restore Custom Android Manifest & Assets
        working-directory: mobile
        run: |
          # Ensure INTERNET & query intents in AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              
              <application
                  android:label="FinVault"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="upi" />
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Get Flutter Packages & Analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee ../flutter_build.log

      - name: Post Failure Log to Commit Comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_CONTENT=$(tail -n 100 flutter_build.log)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="### ❌ Flutter Build Failure Details:
          \`\`\`text
          $LOG_CONTENT
          \`\`\`" || true

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/FinVault.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinVault-Flutter-APK
          path: release-output/FinVault.apk
          retention-days: 30

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "FinVault Flutter Native APK (v2.0.0)"
          body: |
            ### 🚀 FinVault Native Flutter Android Application (v2.0.0)

            - **App Name:** FinVault — Smart Loan & Repayment Ledger
            - **Engine:** Flutter Native Dart (60–120 FPS Butter-Smooth Native Performance)
            - **Platform:** Android 7.0+ (ARM64 & x86_64)
            - **Backend:** 100% On-Device Offline Storage + Supabase Cloud Sync
            - **Live Web App:** [FinVault Web App](https://deepakgowrishankar7.github.io/FinVault/)

            #### 📥 Quick Installation Instructions:
            1. Download the **`FinVault.apk`** file below directly on your Android phone.
            2. Tap the downloaded `.apk` notification or open it from your Files / Downloads app.
            3. If Android shows a security prompt (*"Install unknown apps"*), tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and enjoy ultra-smooth financial management!
          files: release-output/FinVault.apk
          draft: false
          prerelease: false
