name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FinVault Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Runner
        run: |
          echo "Generating official Flutter 3.29 Android runner template..."
          flutter create --org com.finvault --project-name finvault --platforms android /tmp/runner_template

          echo "Syncing official Gradle wrapper and build scripts..."
          mkdir -p mobile/android/gradle
          cp -r /tmp/runner_template/android/gradle/* mobile/android/gradle/
          cp /tmp/runner_template/android/gradlew mobile/android/
          cp /tmp/runner_template/android/gradlew.bat mobile/android/

          # Clean any existing build files to avoid .gradle vs .gradle.kts conflicts
          rm -f mobile/android/settings.gradle*
          rm -f mobile/android/build.gradle*
          rm -f mobile/android/app/build.gradle*

          cp /tmp/runner_template/android/settings.gradle* mobile/android/
          cp /tmp/runner_template/android/build.gradle* mobile/android/
          cp /tmp/runner_template/android/app/build.gradle* mobile/android/app/

          chmod +x mobile/android/gradlew

      - name: Get Flutter Packages
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee ../flutter_build.log

      - name: Print Build Logs on Failure
        if: failure()
        run: |
          echo "==== LAST 120 LINES OF FLUTTER BUILD LOG ===="
          tail -n 120 flutter_build.log || true

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/FinVault.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinVault-Flutter-APK
          path: release-output/FinVault.apk
          retention-days: 30

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "FinVault Flutter Native APK (v2.0.0)"
          body: |
            ### 🚀 FinVault Native Flutter Android Application (v2.0.0)

            - **App Name:** FinVault — Smart Loan & Repayment Ledger
            - **Engine:** Flutter Native Dart (60–120 FPS Butter-Smooth Native Performance)
            - **Platform:** Android 7.0+ (ARM64 & x86_64)
            - **Backend:** 100% On-Device Offline Storage + Supabase Cloud Sync
            - **Live Web App:** [FinVault Web App](https://deepakgowrishankar7.github.io/FinVault/)

            #### 📥 Quick Installation Instructions:
            1. Download the **`FinVault.apk`** file below directly on your Android phone.
            2. Tap the downloaded `.apk` notification or open it from your Files / Downloads app.
            3. If Android shows a security prompt (*"Install unknown apps"*), tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and enjoy ultra-smooth financial management!
          files: release-output/FinVault.apk
          draft: false
          prerelease: false
