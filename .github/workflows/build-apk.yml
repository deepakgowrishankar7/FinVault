name: Build FinVault Multi-Platform (Android APK & Windows Laptop App)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Build Android Release APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Android Platform
        working-directory: mobile
        run: |
          flutter create . --org com.finvault --project-name finvault --platforms android

          # Ensure AndroidX and Jetifier are enabled in gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Ensure FlutterFragmentActivity for biometric authentication
          mkdir -p android/app/src/main/kotlin/com/finvault/dgsfinance
          mkdir -p android/app/src/main/kotlin/com/finvault/finvault
          cat << 'EOF' > android/app/src/main/kotlin/com/finvault/dgsfinance/MainActivity.kt
          package com.finvault.dgsfinance

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
          }
          EOF
          cat << 'EOF' > android/app/src/main/kotlin/com/finvault/finvault/MainActivity.kt
          package com.finvault.finvault

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
          }
          EOF

          # Ensure minSdkVersion 24 in build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' android/app/build.gradle* || true
          chmod +x android/gradlew || true

      - name: Inject Permissions into Manifest
        working-directory: mobile
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/queries>/i \        <intent>\n            <action android:name="android.intent.action.VIEW"\/>\n            <data android:scheme="whatsapp"\/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW"\/>\n            <data android:scheme="upi"\/>\n        <\/intent>' android/app/src/main/AndroidManifest.xml || true

      - name: Get Packages & Build Android APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze || true
          if ! flutter build apk --release --no-tree-shake-icons > build.log 2>&1; then
            echo "### ❌ Android Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: mobile/build.log

      - name: Post Failure Log to Commit Comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_CONTENT=$(tail -n 80 mobile/build.log 2>/dev/null || tail -n 80 build.log 2>/dev/null || echo "No log found")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="### ❌ Android Build Failure:
          \`\`\`text
          $LOG_CONTENT
          \`\`\`" || true

      - name: Prepare Android Output
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/FinVault.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinVault-Android-APK
          path: release-output/FinVault.apk
          retention-days: 30

  # Job 2: Build Windows Desktop Laptop App (.exe & dependencies)
  build-windows:
    name: Build Windows Laptop App (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Configure Windows Desktop Platform
        working-directory: mobile
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --org com.finvault --project-name finvault --platforms windows
          if (Test-Path "assets/app_icon.ico") {
            Copy-Item -Path "assets/app_icon.ico" -Destination "windows/runner/resources/app_icon.ico" -Force
            Write-Host "Replaced Windows app_icon.ico with FinVault logo!"
          }
          if (Test-Path "windows/runner/main.cpp") {
            (Get-Content "windows/runner/main.cpp") -replace 'window\.Create\(L"finvault"', 'window.Create(L"FinVault"' | Set-Content "windows/runner/main.cpp"
            Write-Host "Set Windows window title to FinVault!"
          }
          flutter pub get

      - name: Build Windows Desktop Release (.exe)
        working-directory: mobile
        shell: pwsh
        run: |
          flutter config --no-analytics
          flutter build windows --release

      - name: Post Windows Failure to Commit Comment
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="### ❌ Windows Build Failed on Windows Runner" || true

      - name: Package Windows Desktop ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output
          $foundExe = Get-ChildItem -Path "mobile/build" -Filter "finvault.exe" -Recurse | Select-Object -First 1
          if (-not $foundExe) {
            $foundExe = Get-ChildItem -Path "mobile/build/windows" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*CompilerId*" } | Select-Object -First 1
          }
          if ($foundExe) {
            $releasePath = $foundExe.DirectoryName
            Write-Host "Packaging Windows release from: $releasePath"
            Get-ChildItem -Path $releasePath | Select-Object Name, Length
            Compress-Archive -Path "$releasePath/*" -DestinationPath release-output/FinVault-Windows.zip -Force
          } else {
            Write-Error "Could not locate built finvault.exe in mobile/build"
            exit 1
          }

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinVault-Windows-Laptop-App
          path: release-output/FinVault-Windows.zip
          retention-days: 30

  # Job 3: Publish GitHub Release with both Mobile APK and Windows Laptop App
  publish-release:
    name: Publish Release (Mobile APK & Laptop App)
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: FinVault-Android-APK
          path: release-files
          merge-multiple: true

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: FinVault-Windows-Laptop-App
          path: release-files
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: "FinVault v2.1.1 (Mobile APK & Laptop Windows App)"
          body: |
            ### 🚀 FinVault Major Release (v2.1.1)

            FinVault is an ultra-fast, professional loan and collection ledger designed for Indian private financiers, lending firms, and field recovery agents.

            ---

            ### 📥 Downloads:

            | Platform | File | Description |
            | :--- | :--- | :--- |
            | 📱 **Android Mobile** | [**`FinVault.apk`**](https://github.com/deepakgowrishankar7/FinVault/releases/download/v2.1.1/FinVault.apk) | Direct APK for Android phones & tablets |
            | 💻 **Windows Laptop / PC** | [**`FinVault-Windows.zip`**](https://github.com/deepakgowrishankar7/FinVault/releases/download/v2.1.1/FinVault-Windows.zip) | Portable Windows desktop app (extract & run `finvault.exe`) |

            ---

            ### 🌟 What's New in v2.1.1:
            1. ⚡ **Instant Cloud EMI Auto-Sync**: Recording an EMI collection now saves immediately to local device storage and pushes the updated loan in real-time to the Supabase cloud in the background. No manual refresh or app restart required.
            2. 🔑 **Preserve & Restore Owner Name and UPI ID on Login**: Logging in with an existing Vault ID (`FV-XXXXXX`) on a new phone or laptop automatically pulls and restores the saved Owner Name, Firm Name, and Owner UPI ID from the cloud.
            3. 🔒 **Separated Quick Lock & Secure Logout**: "Lock Vault" provides immediate 1-second PIN / Biometric lock. "Logout from Device" features an informative confirmation modal reassuring you that all data remains safely preserved in the cloud under your Vault ID.
            4. 📖 **Daily Cash Daybook (Daily Tally)**: Dedicated evening cash drawer balance tracker answering today's disbursements, cash collections, UPI/Bank totals, and physical cash box drawer reconciliation with agent-wise breakdown and Daybook PDF export.
            5. 📑 **Borrower Digital Passbook (WhatsApp Mini-Statement)**: 1-tap bank-style bilingual mini-statement PDF showing all installment dates, receipts, principal/interest breakdown, and remaining balance ready to send directly on WhatsApp.
            6. 🔒 **Biometric Fingerprint & Face Unlock**: Instant 1-second biometric unlock via hardware sensor with 4-digit Master PIN fallback.
            7. 📜 **Auto Promissory Note (Demand Promissory Note)**: One-tap bilingual promissory note generator formatted with Indian Rupee numbering in words, ₹1 revenue stamp box, and witnesses ready to print on ₹100 stamp paper or plain A4.
            8. 🪙 **Village Rupee Interest (Vaddi Model)**: Monthly interest per ₹100 calculation with dual interest and principal repayment tracking.
            9. ⚡ **Dynamic UPI QR Code**: Live QR generator for 1x EMI, 2x EMI, or full loan payoff.
            10. 👥 **Multi-Device Cloud Sync & Field Agents**: Automatic sync across field agents and laptops using isolated 6-digit Vault Codes or Supabase.
          files: |
            release-files/**/FinVault.apk
            release-files/**/FinVault-Windows.zip
          draft: false
          prerelease: false
